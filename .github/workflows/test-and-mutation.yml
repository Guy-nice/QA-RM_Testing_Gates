name: Test and Mutation Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run coverage

      - name: Run mutation testing (Stryker)
        run: npx stryker run

      - name: Download SonarQube Scanner
        run: |
          mkdir -p ~/.sonar
          cd ~/.sonar
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.4477-linux-x64.zip
          unzip -q sonar-scanner.zip
          rm sonar-scanner.zip

      - name: SonarQube Scan
        run: |
          ~/.sonar/sonar-scanner-6.1.0.4477-linux-x64/bin/sonar-scanner \
            -Dsonar.projectBaseDir=. \
            -Dsonar.mutation.reportPath=.sonar/mutation-report.json \
            -Dsonar.host.url=https://sonar.nice.com
        # The token comes from the SONAR_TOKEN environment variable below, not the command line.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
